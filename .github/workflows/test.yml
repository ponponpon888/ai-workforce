name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

# A new commit makes older results obsolete. Cancel the superseded run instead
# of paying for both. Keep separate groups per PR or branch.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# WHY THE SUITES ARE GROUPED BY OS
#
# The former workflow started 18 jobs for one pull request. Most finished in
# seconds, but each repeated runner startup, checkout, and Node setup. Grouping
# the same coverage into one job per OS removes that repeated overhead without
# removing the tests.
#
# COST CONTROL (2026-09-17, superseded same day)
#
# This repository was private and every minute past the free allowance was
# billed, Windows at 2x and macOS at 10x the Linux rate. That is why macOS was
# briefly restricted to workflow_dispatch only. The repository went public
# later the same day: GitHub-hosted runners are free and unlimited on a public
# repository regardless of OS, so that restriction no longer applies and macOS
# runs on every push and pull request again, same as Ubuntu and Windows.
#
# The paths-ignore rule for docs-only changes stays. It was never purely a
# cost measure -- a Markdown-only change does not need a ~10 minute CI run
# before it can be reviewed, on a free plan or not.

jobs:
  ubuntu:
    name: test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Diagnose the kit template
        shell: bash
        run: |
          node kit/scripts/doctor.mjs --template
          node kit/scripts/test-doctor.mjs

      - name: Scripts stay ASCII-only
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f"; then
              echo "::error file=$f::non-ASCII characters in a .ps1"
              bad=1
            fi
          done < <(find . -name '*.ps1')
          exit $bad

      - name: Test Node implementations
        shell: bash
        run: |
          node kit/scripts/test-guard-sql.mjs
          node kit/scripts/test-guard-config.mjs
          node kit/scripts/test-guard-destructive.mjs
          node kit/scripts/test-sql-boundaries.mjs
          node kit/scripts/test-guard-secrets.mjs
          node kit/scripts/test-pull-all.mjs
          node kit/scripts/test-pull-all.mjs --target sh
          node kit/scripts/test-probe-guards.mjs

      - name: Test PowerShell implementations under pwsh
        shell: pwsh
        run: |
          ./kit/scripts/test-guard-sql.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./kit/scripts/test-guard-config.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-sql-boundaries.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-guard-secrets.mjs --target ps
          node kit/scripts/test-guard-destructive.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-pull-all.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-probe-guards.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test installers
        shell: bash
        run: |
          node kit/scripts/test-installed-approval.mjs
          node kit/scripts/test-installed-approval.mjs --target ps
          node kit/scripts/test-verify-installers.mjs
          node kit/scripts/test-install-backups.mjs
          node kit/scripts/test-install-backups.mjs --target ps

          node kit/scripts/install.mjs --claude-home "$RUNNER_TEMP/fake-claude"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/fake-claude/settings.json','utf8'))"
          node kit/scripts/doctor.mjs --claude-home "$RUNNER_TEMP/fake-claude"
          for f in CLAUDE.md settings.json hooks/guard-sql.mjs hooks/guard-secrets.mjs hooks/guard-config.mjs hooks/guard-destructive.mjs hooks/lib/shell-lex.mjs scripts/approve-ddl.mjs; do
            test -f "$RUNNER_TEMP/fake-claude/$f" || { echo "::error::installer did not write $f"; exit 1; }
          done

          node kit/scripts/install.mjs --claude-home "$RUNNER_TEMP/fake-skip" --skip-settings --skip-claude-md
          for f in CLAUDE.md settings.json; do
            test ! -e "$RUNNER_TEMP/fake-skip/$f" || { echo "::error::--skip flags did not skip $f"; exit 1; }
          done
          test -f "$RUNNER_TEMP/fake-skip/hooks/guard-sql.mjs" || { echo "::error::hook missing"; exit 1; }

          pwsh -NoProfile -File ./kit/scripts/install.ps1 -ClaudeHome "$RUNNER_TEMP/fake-claude-ps" -Hook powershell
          pwsh -NoProfile -Command "Get-Content '$RUNNER_TEMP/fake-claude-ps/settings.json' -Raw | ConvertFrom-Json | Out-Null"
          node kit/scripts/doctor.mjs --claude-home "$RUNNER_TEMP/fake-claude-ps"
          for f in CLAUDE.md settings.json hooks/guard-sql.ps1 hooks/guard-secrets.ps1 hooks/guard-config.ps1 hooks/guard-destructive.ps1 hooks/lib/shell-lex.ps1 scripts/approve-ddl.ps1; do
            test -f "$RUNNER_TEMP/fake-claude-ps/$f" || { echo "::error::installer did not write $f"; exit 1; }
          done

      # macOS and Windows both hand back a temp directory whose spelling is not
      # the canonical one (/var -> /private/var; 8.3 short names), and Node's
      # ESM loader resolves import.meta.url while argv[1] keeps the spelling it
      # was invoked by. guard-config protects paths by matching text, so that
      # gap let it guard a home nobody was using -- caught only by the macOS and
      # Windows jobs, twice. A symlinked TMPDIR reproduces both here, in the
      # cheapest job, so the next one fails in seconds instead of minutes.
      - name: Guards still protect a home reached through a symlink
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/canonical"
          ln -s canonical "$RUNNER_TEMP/aliased"
          export TMPDIR="$RUNNER_TEMP/aliased"
          test "$(node -e 'console.log(require("fs").realpathSync(require("os").tmpdir()))')" \
            != "$(node -e 'console.log(require("os").tmpdir())')" \
            || { echo "::error::TMPDIR is not actually aliased; this check would prove nothing"; exit 1; }
          node kit/scripts/test-guard-config.mjs
          node kit/scripts/test-probe-guards.mjs

      - name: Validate pitfall records and committed index
        shell: bash
        run: |
          node kit/scripts/validate-pitfalls.mjs
          node kit/scripts/test-validate-pitfalls.mjs
          node kit/scripts/test-lint-pitfalls.mjs
          node kit/scripts/test-check-doc-todos.mjs
          node kit/scripts/test-sql-tool-matcher.mjs
          node kit/scripts/build-pitfall-index.mjs
          changed=$(git status --porcelain -- data/pitfalls.index.json)
          if [ -n "$changed" ]; then
            git diff -- data/pitfalls.index.json
            echo "::error::data/pitfalls.index.json is stale or untracked"
            exit 1
          fi
          node kit/scripts/lint-pitfalls.mjs

      - name: Report TODO markers in release docs
        continue-on-error: true
        shell: bash
        run: node kit/scripts/check-doc-todos.mjs

  windows:
    name: test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Diagnose the kit template
        shell: pwsh
        run: |
          node kit/scripts/doctor.mjs --template
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-doctor.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.FullName)::parse errors"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Test Node implementations
        shell: pwsh
        run: |
          node kit/scripts/test-guard-sql.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-guard-config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-guard-destructive.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-sql-boundaries.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-guard-secrets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-pull-all.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-probe-guards.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test PowerShell implementations under pwsh
        shell: pwsh
        run: |
          ./kit/scripts/test-guard-sql.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./kit/scripts/test-guard-config.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-sql-boundaries.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-guard-secrets.mjs --target ps
          node kit/scripts/test-guard-destructive.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-pull-all.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-probe-guards.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          node kit/scripts/test-install-backups.mjs --target ps --pwsh powershell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-installed-approval.mjs --target ps --pwsh powershell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./kit/scripts/test-guard-sql.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./kit/scripts/test-guard-config.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-sql-boundaries.mjs --target ps --pwsh powershell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./kit/scripts/test-pull-all.mjs --target ps --pwsh powershell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./kit/scripts/test-guard-secrets.mjs --target ps --pwsh powershell.exe
          node ./kit/scripts/test-probe-guards.mjs --target ps --pwsh powershell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./kit/scripts/test-guard-destructive.mjs --target ps --pwsh powershell.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify entry-point success codes
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'exitcode-probe'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          & git init --initial-branch=main "$probe/repo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git -C "$probe/repo" -c user.name=fixture -c user.email=fixture@example.invalid commit --allow-empty -m fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wrapper = Join-Path $probe 'wrapper.ps1'
          $cases = @(
            './kit/scripts/test-guard-sql.ps1',
            './kit/scripts/test-guard-config.ps1',
            "./kit/scripts/pull-all.ps1 -Root '$probe' -Repos repo -DryRun",
            "./kit/scripts/install.ps1 -ClaudeHome '$probe/fake-claude' -Hook powershell",
            "./kit/scripts/approve-ddl.ps1 -Sql 'create table probe_t (id int)' -ApprovalDir '$probe/approvals' -Force"
          )
          $bad = 0
          foreach ($case in $cases) {
            $body = "`$ErrorActionPreference = 'stop'`n$case`nif ((Test-Path -LiteralPath variable:\LASTEXITCODE)) { exit `$LASTEXITCODE }`n"
            [System.IO.File]::WriteAllText($wrapper, $body, (New-Object System.Text.UTF8Encoding($false)))
            & pwsh -NoProfile -Command ". '$wrapper'" *> $null
            if ($LASTEXITCODE -ne 0) {
              $bad++
              Write-Host "::error::$case did its job but exited $LASTEXITCODE"
            }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Test installers
        shell: pwsh
        run: |
          node kit/scripts/test-installed-approval.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-installed-approval.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-verify-installers.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-install-backups.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node kit/scripts/test-install-backups.mjs --target ps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node kit/scripts/install.mjs --claude-home "$env:RUNNER_TEMP/fake-claude"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP/fake-claude/settings.json" -Raw | ConvertFrom-Json | Out-Null
          node kit/scripts/doctor.mjs --claude-home "$env:RUNNER_TEMP/fake-claude"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in 'CLAUDE.md', 'settings.json', 'hooks/guard-sql.mjs', 'hooks/guard-secrets.mjs', 'hooks/guard-config.mjs', 'hooks/guard-destructive.mjs', 'hooks/lib/shell-lex.mjs', 'scripts/approve-ddl.mjs') {
            if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/fake-claude/$f")) { throw "installer did not write $f" }
          }

          node kit/scripts/install.mjs --claude-home "$env:RUNNER_TEMP/fake-skip" --skip-settings --skip-claude-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in 'CLAUDE.md', 'settings.json') {
            if (Test-Path -LiteralPath "$env:RUNNER_TEMP/fake-skip/$f") { throw "--skip flags did not skip $f" }
          }

          ./kit/scripts/install.ps1 -ClaudeHome "$env:RUNNER_TEMP/fake-claude-ps" -Hook powershell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP/fake-claude-ps/settings.json" -Raw | ConvertFrom-Json | Out-Null
          node kit/scripts/doctor.mjs --claude-home "$env:RUNNER_TEMP/fake-claude-ps"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in 'CLAUDE.md', 'settings.json', 'hooks/guard-sql.ps1', 'hooks/guard-secrets.ps1', 'hooks/guard-config.ps1', 'hooks/guard-destructive.ps1', 'hooks/lib/shell-lex.ps1', 'scripts/approve-ddl.ps1') {
            if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/fake-claude-ps/$f")) { throw "installer did not write $f" }
          }

  macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Test cross-platform entry points
        shell: bash
        run: |
          node kit/scripts/test-guard-sql.mjs
          node kit/scripts/test-guard-config.mjs
          node kit/scripts/test-guard-destructive.mjs
          node kit/scripts/test-sql-boundaries.mjs
          node kit/scripts/test-guard-secrets.mjs
          node kit/scripts/test-pull-all.mjs
          node kit/scripts/test-pull-all.mjs --target ps
          node kit/scripts/test-pull-all.mjs --target sh
          node kit/scripts/test-probe-guards.mjs
          node kit/scripts/test-probe-guards.mjs --target ps
      - name: Run the core suite via verify-installers
        shell: bash
        run: node kit/scripts/verify-installers.mjs --suite core --target node --json
